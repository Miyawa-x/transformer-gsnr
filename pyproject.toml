[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-gsnr"
version = "0.1.0"
description = "Controlled layer-wise GSNR experiments for vision Transformers"
requires-python = ">=3.10"
dependencies = ["torch==2.6.0", "torchvision==0.21.0", "numpy==2.2.6"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
include = ["transformer_gsnr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
